# MongoDB configuration — AgentMesh platform
# Mounted at /etc/mongod.conf in the mongo container.
#
# quiet: true         — suppresses most INFO-level messages at startup.
# verbosity: -1       — per-component: inherit from global (no debug output).
# slowOpThresholdMs   — GrowthBook's agenda job writes take ~100ms; raise to
#                       500ms so only genuinely slow ops are logged.
# diagnosticDataCollection — disables FTDC (periodic diagnostic data).
#
# Note: systemLog.filter is NOT supported by mongo:7 and must not be used.
# Remaining NETWORK/ACCESS INFO chatter comes from GrowthBook's Mongoose pool.
# The health check uses a TCP probe (not mongosh) to avoid amplifying this noise.

systemLog:
  quiet: true
  # systemLog.filter is not supported by mongo:7 — removed.
  # quiet: true suppresses most INFO-level messages.
  component:
    network:
      verbosity: -1
    accessControl:
      verbosity: -1
    command:
      verbosity: -1
    write:
      verbosity: -1

storage:
  dbPath: /data/db

net:
  bindIp: "0.0.0.0"

operationProfiling:
  slowOpThresholdMs: 500
  mode: off

setParameter:
  diagnosticDataCollectionEnabled: false
