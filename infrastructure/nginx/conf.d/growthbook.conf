# ── growthbook.local — feature flag admin UI + SDK API ────────────────────────
#
# GrowthBook: port 3000 = Next.js UI (catch-all, returns 200 for any path)
#             port 3100 = Express API (requires auth, returns 401 for page paths)
#
# Routing strategy:
#   /_next/*   → Next.js directly          (static assets, no Express round-trip)
#   /auth/*    → Express directly          (auth responses must reach JS client)
#   /api/*     → Express directly          (SDK API + REST, auth responses intact)
#   everything else → Express first:
#       200/2xx  from Express → return to browser (authenticated API call)
#       401/403  from Express → fall to @nextjs   (browser nav, no token sent)
#       404      from Express → fall to @nextjs   (Next.js page route)

server {
    listen 80;
    server_name growthbook.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name growthbook.local;

    ssl_certificate     /etc/nginx/certs/growthbook.local.crt;
    ssl_certificate_key /etc/nginx/certs/growthbook.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Root path — must go to Next.js directly.
    # Express has GET / returning API metadata JSON (200), which would bypass
    # the 401/404 fallback and show raw JSON instead of the GrowthBook home page.
    location = / {
        set $growthbook_ui http://growthbook:3000;
        proxy_pass         $growthbook_ui;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # Static Next.js assets — skip Express entirely
    location /_next/ {
        set $growthbook_ui http://growthbook:3000;
        proxy_pass         $growthbook_ui;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Auth endpoints — Express, responses go directly to JS client (no interception)
    location /auth/ {
        set $growthbook_api http://growthbook:3100;
        proxy_pass         $growthbook_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SDK API + REST API — Express, responses go directly to JS client (no interception)
    location /api/ {
        set $growthbook_api http://growthbook:3100;
        proxy_pass         $growthbook_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Everything else: Express first.
    # 200/2xx → authenticated API response, return to browser.
    # 401/403  → browser navigation without token, fall to @nextjs for the HTML page.
    # 404      → unknown Express path, fall to @nextjs for the Next.js page route.
    location / {
        set $growthbook_api http://growthbook:3100;
        proxy_pass             $growthbook_api;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_intercept_errors on;
        error_page 401 403 404 = @nextjs;
    }

    # Next.js fallback — serves all GrowthBook admin pages
    location @nextjs {
        set $growthbook_ui http://growthbook:3000;
        proxy_pass         $growthbook_ui;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
        proxy_cache        off;
    }
}
