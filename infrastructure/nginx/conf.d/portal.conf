# ── portal.local (+ default for IP / unmatched-hostname access) ──────────────

# HTTP → HTTPS redirect — catches portal.local and bare-IP access
server {
    listen 80 default_server;
    server_name portal.local _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name portal.local _;

    ssl_certificate     /etc/nginx/certs/portal.local.crt;
    ssl_certificate_key /etc/nginx/certs/portal.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Use Docker's embedded DNS — defer upstream resolution to request time
    # so nginx starts cleanly even if backends aren't up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Culprit ────────────────────────────────────────────────────────────
    location /culprit/ {
        set $culprit_api http://culprit-api:8000;
        rewrite ^/culprit/(.*)$ /$1 break;
        proxy_pass $culprit_api;
        # proxy_read_timeout must stay comfortably above the slowest
        # timeout Culprit's own code can legitimately take to answer -
        # found 2026-10-16, a real production failure: this was 180s while
        # shared/src/llm/openai_compatible.py's (and gemini.py's) RCA
        # provider HTTP call has its own read timeout for a slow custom LLM
        # gateway. Any response landing between this value and that one
        # gets cut off here first, as a generic nginx-level failure with
        # nothing logged in Culprit's own logs - silently defeating the
        # very patience that timeout exists to provide. Raised a second
        # time alongside that timeout going from 240s to 600s (matching
        # Anthropic's own SDK default - 240s itself still wasn't enough
        # for a real large tool-calling completion through a slow gateway);
        # 660s leaves a real margin above it rather than matching exactly.
        proxy_read_timeout    660s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lets FastAPI's auto-generated /docs (Swagger UI) know it's mounted
        # under /culprit/ instead of the site root - without this, the docs
        # page fetches /openapi.json (site root), which nginx routes to
        # Portal's SPA, not Culprit. See culprit/api/root_path_middleware.py.
        proxy_set_header X-Forwarded-Prefix /culprit;
    }

    # ── Portal API ───────────────────────────────────────────────────────────
    location /api/ {
        set $portal_api http://portal-api:8000;
        proxy_pass $portal_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Portal SPA (catch-all) ───────────────────────────────────────────────
    location / {
        set $portal_ui http://portal-ui:80;
        proxy_pass $portal_ui;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
